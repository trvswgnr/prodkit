name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency signatures
        run: pnpm -r exec npm audit signatures

      - name: Audit dependency vulnerabilities
        run: pnpm audit

      - name: Run project quality gate
        env:
          CHANGELOG_API_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: pnpm run gate

      - name: Publish op coverage report
        run: pnpm --filter @prodkit/op run coverage

      - name: Upload op coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: op-coverage
          path: packages/op/coverage
          if-no-files-found: error

  better-result-compatibility:
    name: better-result / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lower bound
            better_result: "3.0.1"
          - label: highest supported
            better_result: "^3.0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select better-result compatibility version
        env:
          BETTER_RESULT_RANGE: ${{ matrix.better_result }}
        run: |
          set -euo pipefail
          version="$(
            pnpm view "better-result@${BETTER_RESULT_RANGE}" version --json |
              node --input-type=module -e '
                import fs from "node:fs";
                const value = JSON.parse(fs.readFileSync(0, "utf8"));
                const versions = Array.isArray(value) ? value : [value];
                const selected = versions.at(-1);
                if (typeof selected !== "string") process.exit(1);
                process.stdout.write(selected);
              '
          )"
          echo "Resolved better-result@${BETTER_RESULT_RANGE} to ${version}"
          echo "BETTER_RESULT_VERSION=${version}" >> "$GITHUB_ENV"
          pnpm --filter @prodkit/op add --save-dev "better-result@${version}"

      - name: Run op compatibility suite
        run: |
          pnpm --filter @prodkit/op run build
          pnpm --filter @prodkit/op run typecheck
          pnpm --filter @prodkit/op run test
          pnpm --filter @prodkit/tools run runtime:smoke:node

  runtime-smoke:
    name: runtime smoke / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
            label: bun
            node_version: "24.22.1"
          - runtime: deno
            label: deno
            node_version: "24.22.1"
          - runtime: edge
            label: edge
            node_version: "24.22.1"
          - runtime: node
            label: node-22
            node_version: "22.23.4"
          - runtime: node
            label: node-24
            node_version: "24.22.1"
          - runtime: node
            label: node-26
            node_version: "26.12.1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run runtime smoke
        run: pnpm --filter @prodkit/tools run runtime:smoke:${{ matrix.runtime }}

  typescript-compatibility:
    name: op-lint / TypeScript ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "5.9.2"
            typescript: "5.9.2"
            cli: tsc
          - label: "6.0.3"
            typescript: "6.0.3"
            cli: tsc
          - label: "6 compatibility package"
            typescript: "npm:@typescript/typescript6@6.0.2"
            cli: tsc6
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build operation dependencies
        run: pnpm --filter @prodkit/op... run build

      - name: Select TypeScript compatibility version
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
        run: pnpm --filter @prodkit/op-lint add --save-dev --save-exact "typescript@${TYPESCRIPT_VERSION}"

      - name: Test op-lint compiler API and linter integration
        env:
          TYPESCRIPT_CLI: ${{ matrix.cli }}
        run: |
          pnpm --filter @prodkit/op-lint exec "${TYPESCRIPT_CLI}" --noEmit
          pnpm --filter @prodkit/op-lint run test

  bundle-size:
    name: bundle size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Package size report
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2.10.0
        with:
          build-script: "build:size"
          pattern: "packages/op/dist/bundle-size/*.min.mjs"
          compression: "gzip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
