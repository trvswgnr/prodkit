name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks-simulation:
    name: benchmarks (simulation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @prodkit/op
        run: pnpm --filter @prodkit/op run build

      - name: Run benchmarks (simulation)
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: simulation
          working-directory: benchmarks
          run: pnpm vitest bench --run op/codspeed.sync.bench.ts

  benchmarks-walltime:
    name: benchmarks (walltime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build benchmarked packages
        run: |
          pnpm --filter @prodkit/op run build
          pnpm --filter @prodkit/op-lint run build

      - name: Install libc debug symbols
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libc6-dbg

      - name: Run benchmarks (walltime)
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: walltime
          working-directory: benchmarks
          run: pnpm vitest bench --run op/codspeed.walltime.bench.ts op-lint/codspeed.walltime.bench.ts

      - name: Write comparison report
        run: pnpm --filter @prodkit/benchmarks run compare

      - name: Upload comparison report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: op-comparison-report
          path: benchmarks/op/.artifacts/comparison-report.json
          if-no-files-found: error
