name: Release

on:
  push:
    tags:
      - "op-v*"
      - "op-lint-v*"
      - "std-v*"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  validate-publish-source:
    runs-on: ubuntu-latest
    outputs:
      allow_publish: ${{ steps.validate.outputs.allow_publish }}
      package_id: ${{ steps.validate.outputs.package_id }}
      tag_commit: ${{ steps.validate.outputs.tag_commit }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag points to main
        id: validate
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package_id="${tag%%-v*}"

          case "$package_id" in
            op|op-lint|std) ;;
            *)
              echo "Unsupported release tag prefix: ${tag}"
              echo "allow_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          version="${tag#${package_id}-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag version: ${tag}"
            echo "allow_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force --tags origin main
          tag_commit="$(git rev-list -n 1 "${tag}")"
          if ! git merge-base --is-ancestor "${tag_commit}" "origin/main"; then
            echo "Tag ${tag} is not on main; skipping publish."
            echo "allow_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --merged "origin/main" --list "${package_id}-v*" | sort -V | tail -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No ${package_id}-v* release tags found on main; skipping publish."
            echo "allow_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${tag}" != "$latest_tag" ]; then
            echo "Tag ${tag} is not the latest ${package_id} release tag (${latest_tag}); skipping publish."
            echo "allow_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "package_id=${package_id}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"
          echo "allow_publish=true" >> "$GITHUB_OUTPUT"

      - name: Verify CI passed for tagged commit
        if: steps.validate.outputs.allow_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_commit="${{ steps.validate.outputs.tag_commit }}"
          deadline=$((SECONDS + 1800))
          while true; do
            runs_json="$(gh run list --workflow ci.yml --commit "$tag_commit" --event push --json databaseId,status,conclusion,url --limit 20)"
            decision="$(
              RUNS_JSON="$runs_json" node <<'JS'
          const runs = JSON.parse(process.env.RUNS_JSON ?? "[]");
          const running = runs.find((run) => run.status !== "completed");
          if (running) {
            console.log(`pending ${running.url}`);
            process.exit(0);
          }
          const success = runs.find((run) => run.conclusion === "success");
          if (success) {
            console.log(`success ${success.url}`);
            process.exit(0);
          }
          const failed = runs[0];
          if (failed) {
            console.log(`failure ${failed.conclusion ?? "unknown"} ${failed.url}`);
            process.exit(0);
          }
          console.log("missing");
          JS
            )"

            case "$decision" in
              success\ *)
                echo "CI passed for ${tag_commit}: ${decision#success }"
                exit 0
                ;;
              failure\ *)
                echo "CI did not pass for ${tag_commit}: ${decision#failure }"
                exit 1
                ;;
              missing)
                echo "No CI run found yet for ${tag_commit}."
                ;;
              pending\ *)
                echo "Waiting for CI to complete for ${tag_commit}: ${decision#pending }"
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for CI to pass for ${tag_commit}."
              exit 1
            fi
            sleep 20
          done

  publish:
    needs: validate-publish-source
    if: needs.validate-publish-source.outputs.allow_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve npm package
        run: |
          case "${{ needs.validate-publish-source.outputs.package_id }}" in
            op) echo "NPM_FILTER=@prodkit/op" >> "$GITHUB_ENV" ;;
            op-lint) echo "NPM_FILTER=@prodkit/op-lint" >> "$GITHUB_ENV" ;;
            std) echo "NPM_FILTER=@prodkit/std" >> "$GITHUB_ENV" ;;
            *)
              echo "Unsupported package id: ${{ needs.validate-publish-source.outputs.package_id }}"
              exit 1
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.8

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: |
          pnpm --filter @prodkit/op run build
          if [ "$NPM_FILTER" != "@prodkit/op" ]; then
            pnpm --filter "$NPM_FILTER" run build
          fi

      - name: Verify changelog includes current package version
        run: pnpm --filter "$NPM_FILTER" run changelog:check

      - name: Verify tag version matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package_id="${tag%%-v*}"
          tag_version="${tag#${package_id}-v}"
          package_version="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('packages/${package_id}/package.json','utf8')).version)")"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "Tag version ${tag_version} does not match packages/${package_id}/package.json version ${package_version}"
            exit 1
          fi

      - name: Publish to npm
        run: pnpm --filter "$NPM_FILTER" publish --access public --provenance --no-git-checks
